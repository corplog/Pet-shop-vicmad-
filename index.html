<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pet Shop Vicmad</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#FFFDF6;--card:#fff;--ink:#3B1C0E;--mut:#7A5A47;--red:#E5156F;--pine:#5A2D14;--gold:#FFC21A;--line:#F2DC9A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#FFFDF6;--card:#fff;--ink:#3B1C0E;--mut:#7A5A47;--red:#E5156F;--pine:#5A2D14;--line:#F2DC9A}}
:root[data-theme="dark"]{--bg:#FFFDF6;--card:#fff;--ink:#3B1C0E;--mut:#7A5A47;--red:#E5156F;--pine:#5A2D14;--line:#F2DC9A}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body.own::before{background:#4A2411}
h1,h2,h3,.brand{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.brand{font-weight:800;font-size:1.2rem;padding:16px 0 0;color:var(--pine)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{color:#5A2D14}}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg span{position:absolute;bottom:-60px;line-height:1;opacity:0;animation:fl linear infinite;will-change:transform}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:0}10%,90%{opacity:.85}100%{transform:translateY(-118vh) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){#bg span{animation:none;opacity:.55;bottom:auto;top:var(--t)}}
.wrap{position:relative;z-index:1}
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:15;background:var(--red);color:#fff;border:0;border-radius:16px;padding:14px 18px;font:800 1rem Nunito,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer}
.cartbar:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-right:6px;vertical-align:-1px}
.qs{display:inline-flex;align-items:center;gap:10px}.qs button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:800 1.2rem Nunito,sans-serif;cursor:pointer}.qs span{min-width:22px;text-align:center;font-weight:800}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ln>div:first-child{flex:1}.ln small{display:block;color:var(--mut)}
.tot{display:flex;justify-content:space-between;font:800 1.3rem "Baloo 2",sans-serif;padding:14px 0}
.err{color:var(--red);font-weight:800;margin:0 0 10px}
.lnk{background:none;border:0;color:var(--red);font:800 .9rem Nunito,sans-serif;text-decoration:underline;cursor:pointer;padding:4px 0}
.rowb{display:flex;justify-content:space-between;align-items:center}
.gbtn{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:8px 16px;font:800 1rem Nunito,sans-serif;cursor:pointer}
.gbtn:focus-visible,.lnk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gd{background:#FFF8E0;border-radius:16px;padding:8px}.gd svg{width:100%;height:auto;display:block}
.gt{width:100%;border-collapse:collapse;margin:10px 0}.gt th,.gt td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}.gt th{color:var(--mut);font-size:.85rem}.gt td:first-child{font-weight:800}
.grow{display:grid;grid-template-columns:78px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}.grow input{margin-top:0!important}
.okm{color:var(--pine);font-weight:800;margin:0 0 10px}
.mine{margin-top:18px;padding-top:12px;border-top:2px dashed var(--line)}
.top{display:flex;justify-content:center;padding:12px 0 0}.logo{width:min(250px,64vw);height:auto;display:block}
.hero{display:grid;gap:18px;align-items:center;padding:18px 0 26px}
@media(min-width:700px){.hero{grid-template-columns:1.1fr .9fr}}
h1{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800}
.lead{color:var(--mut);margin:12px 0 18px;max-width:34ch}
.btn,.btn2{display:inline-block;font:800 1rem Nunito,sans-serif;border-radius:14px;padding:12px 20px;text-decoration:none;cursor:pointer;text-align:center}
.btn{background:var(--red);color:#fff;border:0}
.btn2{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:9px 14px;margin:0 6px 6px 0}
.btn:focus-visible,.btn2:focus-visible,.chip:focus-visible,.card:focus-visible,.sz:focus-visible,.x:focus-visible,input:focus-visible,textarea:focus-visible,.bar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.heroart{aspect-ratio:1;max-width:340px;width:100%;justify-self:center;border-radius:50%;background:radial-gradient(circle at 18% 28%,#fff 0 3px,transparent 4px),radial-gradient(circle at 82% 22%,#fff 0 4px,transparent 5px),radial-gradient(circle at 12% 72%,#fff 0 4px,transparent 5px),#FBD9DE;overflow:hidden}
.art{aspect-ratio:1;width:100%}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.ph{display:grid;place-items:center;font-size:4rem;background:#FFE9A8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 .95rem Nunito,sans-serif;border-radius:99px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card .t{padding:10px 12px 14px}
.card h3{font-size:1.05rem}
.card .k{color:var(--mut);font-size:.85rem}
.card .p{font-weight:800;color:var(--red);margin-top:4px}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:0 0 90px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#4A2411;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.bar button{font:800 .9rem Nunito,sans-serif;border:0;border-radius:10px;padding:8px 12px;background:#6B3A1F;color:#fff;cursor:pointer}
.bar .pub{background:var(--gold);color:#222}
.bar button:disabled{opacity:.45;cursor:default}
.warn{background:#FFF1CF;color:#5A4200;padding:8px 14px;font-size:.9rem}
.ov{position:fixed;inset:0;background:rgba(10,20,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));position:relative;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
.sheet .art{max-height:50vh}
.sheet .in{padding:14px 20px 0}
.sheet h2{font-size:1.6rem}
.sheet .p{font:800 1.4rem "Baloo 2",sans-serif;color:var(--red);margin:2px 0 8px}
.sheet p{color:var(--mut);margin:0 0 12px}
.szs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.sz{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-width:48px;padding:8px 12px;font:800 .95rem Nunito,sans-serif;cursor:pointer}
.sz[aria-pressed="true"]{border-color:var(--red);background:var(--red);color:#fff}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#222;font-size:1.3rem;cursor:pointer;z-index:2}
.sheet .btn{display:block;width:100%}
.f label{display:block;font-weight:800;font-size:.9rem;margin:0 0 10px}
.f input,.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:400 1rem Nunito,sans-serif}
.f small{display:block;color:var(--mut);font-weight:400}
.del{color:var(--red);border-color:var(--red);margin:10px 0 0;width:100%}

  <p style="margin-top:12px"><b>A · Largo:</b> de la base del cuello a la base de la cola, por el lomo.<br><b>B · Ancho:</b> contorno de la parte más ancha del pecho, justo detrás de las patas delanteras.</p>
  <table class="gt"><tr><th>Talla</th><th>Largo (cm)</th><th>Ancho (cm)</th></tr>${G.map(r=>`<tr><td>${esc(r.t)}</td><td>${esc(r.l)}</td><td>${esc(r.a)}</td></tr>`).join("")}</table>
  <p>Mide con una cinta suave, sin apretar. Si tu perro queda entre dos tallas, elige la mayor.</p>

}
function render(){
  const cats=["Todo",...new Set(P.map(p=>p.c).filter(Boolean))],shown=P.filter(p=>cat==="Todo"||p.c===cat);
  document.body.classList.toggle("own",owner);
  $("#root").innerHTML=`${owner?`<div class="bar"><b>Modo dueño</b><button data-a="set">Ajustes</button><button class="pub" data-a="save" ${dirty?"":"disabled"}>${window.claude?"Guardar y publicar":"Descargar página actualizada"}</button><span id="st">${dirty?"Cambios sin publicar":""}</span></div>${S.wa?"":'<div class="warn">Agrega tu número de WhatsApp en Ajustes para recibir pedidos.</div>'}`:""}
  <div class="wrap">${S.logo?`<header class="top"><img class="logo" src="${S.logo}" alt="${esc(S.name)}"></header>`:`<div class="brand">🐾 ${esc(S.name)}</div>`}
  <section class="hero"><div><p class="lead" style="margin-top:0">Ropita, disfraces y accesorios para cachorros. Toca un modelo para ver su foto grande, elegir talla, color y cantidad, y agregarlo al carrito.</p><button class="gbtn" data-a="guide">📏 Guía de tallas</button></div></section>
  <section id="catalogo"><div class="chips">${cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="grid">${shown.map(p=>`<button class="card" data-id="${p.id}">${art(p)}<div class="t"><h3>${esc(p.n)}</h3><div class="k">${esc(p.c)}</div><div class="p">${money(p)}</div></div></button>`).join("")}</div></section>
  
  <footer>Escríbenos por WhatsApp para confirmar disponibilidad y tallas.</footer></div>${cart.length?`<button class="cartbar" data-a="cart">🛒 Ver carrito (${cnt()}) · ${mo(tot())}</button>`:""}`;
  }
$("#root").onclick=e=>{
  const c=e.target.closest("[data-c]"),k=e.target.closest("[data-id]"),a=e.target.closest("[data-a]");
  if(c){cat=c.dataset.c;render()}
  else if(k){cur=P.find(p=>p.id==k.dataset.id);last=k;sel={s:null,c:null,q:1,m:""};view()}
  else if(a){const x=a.dataset.a;
    if(x==="add"){cur={id:Date.now(),n:"Nuevo producto",c:"Ropita",p:"",d:"",s:ALL.slice(),col:[],img:""};P.unshift(cur);mark();edit()}
    if(x==="set")sets();
    if(x==="guide"){gfrom=false;guide()}
    if(x==="cart")showCart();
    if(x==="save")save();}
};
function open(h){$("#sheet").innerHTML=h;$("#ov").classList.add("on");const b=$("#close");b&&b.focus()}
function shut(){$("#ov").classList.remove("on");render();last&&last.isConnected&&last.focus()}
function mark(){dirty=true;const b=document.querySelector('[data-a="save"]');if(b)b.disabled=false;const s=$("#st");if(s)s.textContent="Cambios sin publicar"}
function view(){
  mode="view";const p=cur,cl=p.col||[];
  open(`<button class="x" aria-label="Cerrar" id="close">✕</button>${art(p)}<div class="in"><h2>${esc(p.n)}</h2><div class="p">${money(p)}</div><p>${esc(p.d)}</p>
  ${p.s.length?`<div class="rowb"><b>Talla</b><button class="lnk" data-a="guidep">📏 Guía de tallas</button></div><div class="szs" role="group" aria-label="Talla">${p.s.map(s=>`<button class="sz" aria-pressed="${s===sel.s}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>`:""}
  ${cl.length?`<b>Color</b><div class="szs" role="group" aria-label="Color">${cl.map(c=>`<button class="sz" aria-pressed="${c===sel.c}" data-k="${esc(c)}">${dot(c)}${esc(c)}</button>`).join("")}</div>`:""}
  <b>Cantidad</b><div class="qs" style="margin:6px 0 16px"><button data-q="-1" aria-label="Menos">−</button><span>${sel.q}</span><button data-q="1" aria-label="Más">+</button></div>
  ${sel.m?`<div class="err" role="alert">${sel.m}</div>`:""}${sel.ok?`<div class="okm" role="status">${sel.ok}</div>`:""}<button class="btn" data-a="addcart">🛒 Agregar al carrito</button>
  ${(()=>{const ls=cart.map((l,i)=>[l,i]).filter(x=>x[0].id===p.id);return ls.length?`<div class="mine"><b>En tu pedido de este modelo</b>${ls.map(x=>`<div class="ln"><div><b>Talla ${esc(x[0].s||"-")}</b><small>${dot(x[0].c||"")}${esc(x[0].c||"-")}</small></div><div class="qs"><button data-ql="${x[1]},-1" aria-label="Menos">−</button><span>${x[0].q}</span><button data-ql="${x[1]},1" aria-label="Más">+</button></div><button class="qs" data-rm="${x[1]}" aria-label="Quitar" style="border:0;background:none;font-size:1.2rem;cursor:pointer">🗑</button></div>`).join("")}<button class="btn2" data-a="cart" style="width:100%;margin:12px 0 0">Ver carrito y enviar pedido</button></div>`:""})()}${owner?'<button class="btn2 del" data-a="edit" style="color:inherit;border-color:var(--line)">Editar producto</button>':""}</div>`);
}
function add(){const p=cur;
  if(p.s.length&&!sel.s){sel.m="Elige una talla.";return view()}
  if((p.col||[]).length&&!sel.c){sel.m="Elige un color.";return view()}
  const f=cart.find(l=>l.id===p.id&&l.s===sel.s&&l.c===sel.c);
  if(f)f.q=Math.min(99,f.q+sel.q);else cart.push({id:p.id,n:p.n,s:sel.s||"",c:sel.c||"",q:sel.q,p:p.p});
  saveCart();sel={s:null,c:null,q:1,m:"",ok:"✓ Agregado. Elige otra talla o color de este modelo si necesitas más."};view()}
function orderLink(){
  const wa=String(S.wa).replace(/\D/g,""),L=cart.map((l,i)=>`${i+1}) Modelo: ${l.n}\n   Talla: ${l.s||"-"}\n   Color: ${l.c||"-"}\n   Cantidad: ${l.q}`+(l.p===""||l.p==null?"":`\n   Subtotal: ${mo(l.p*l.q)}`)).join("\n\n");
  return `https://wa.me/${wa}?text=`+encodeURIComponent(`Hola, quiero hacer este pedido:\n\n${L}\n\nTotal: ${mo(tot())}`)}
function showCart(){
  mode="cart";open(`<button class="x" aria-label="Cerrar" id="close">✕</button><div class="in" style="padding-top:60px"><h2 style="margin-bottom:6px">Tu pedido</h2>${cart.length?cart.map((l,i)=>`<div class="ln"><div><b>${esc(l.n)}</b><small>Talla ${esc(l.s||"-")} · ${dot(l.c||"")}${esc(l.c||"-")}${l.p===""||l.p==null?"":" · "+mo(l.p*l.q)}</small></div><div class="qs"><button data-ql="${i},-1" aria-label="Menos">−</button><span>${l.q}</span><button data-ql="${i},1" aria-label="Más">+</button></div><button class="qs" data-rm="${i}" aria-label="Quitar" style="border:0;background:none;font-size:1.2rem;cursor:pointer">🗑</button></div>`).join("")+`<div class="tot"><span>Total</span><span>${mo(tot())}</span></div><a class="btn" target="_blank" rel="noopener" href="${orderLink()}">Enviar pedido por WhatsApp</a><button class="btn2 del" data-a="clear" style="color:inherit;border-color:var(--line)">Vaciar carrito</button>`:"<p>Tu carrito está vacío.</p>"}</div>`);
}
function edit(){
  const p=cur;
  open(`<button class="x" aria-label="Cerrar" id="close">✕</button>${art(p)}<div class="in f"><label class="btn2">📷 ${p.img?"Cambiar foto":"Subir foto"}<input type="file" accept="image/*" hidden id="file"></label>${p.img?'<button class="btn2" data-a="noimg">Quitar foto</button>':""}
  <label>Nombre<input data-f="n" value="${esc(p.n)}"></label>
  <label>Categoría<input data-f="c" list="cl" value="${esc(p.c)}"></label><datalist id="cl"><option value="Ropita"><option value="Disfraces"><option value="Accesorios"></datalist>
  <label>Precio (${esc(S.cur)})<input data-f="p" type="number" inputmode="decimal" min="0" value="${p.p}"></label>
  <label>Descripción<textarea data-f="d" rows="3">${esc(p.d)}</textarea></label>
  <label>Colores disponibles<input data-f="col" value="${esc((p.col||[]).join(", "))}"><small>Sepáralos con comas. Ejemplo: Rojo, Azul, Rosa</small></label>
  <div><b>Tallas</b></div><div class="szs">${ALL.map(z=>`<button class="sz" aria-pressed="${p.s.includes(z)}" data-z="${z}">${z}</button>`).join("")}</div>
  <button class="btn" data-a="done">Listo</button><button class="btn2 del" data-a="del">Eliminar producto</button></div>`);
}
function sets(){
  open(`<button class="x" aria-label="Cerrar" id="close">✕</button><div class="in f" style="padding-top:60px"><h2 style="margin-bottom:14px">Ajustes</h2>
  <label>Nombre de la tienda<input data-st="name" value="${esc(S.name)}"></label>
    <label>WhatsApp para pedidos<input data-st="wa" type="tel" inputmode="numeric" value="${esc(S.wa)}"><small>Con código de país, solo números. Ejemplo: 5215512345678</small></label>
  <label>Símbolo de moneda<input data-st="cur" value="${esc(S.cur)}"></label>
  <div style="margin:14px 0 4px"><b>Guía de tallas (cm)</b><small style="display:block;color:var(--mut)">Largo y ancho por talla. Puedes escribir rangos, por ejemplo 20–22.</small></div>
  ${(D.g||[]).map((r,i)=>`<div class="grow"><b>Talla ${esc(r.t)}</b><input data-g="${i},l" value="${esc(r.l)}" aria-label="Largo talla ${esc(r.t)}" placeholder="Largo"><input data-g="${i},a" value="${esc(r.a)}" aria-label="Ancho talla ${esc(r.t)}" placeholder="Ancho"></div>`).join("")}
  <button class="btn" data-a="done">Listo</button></div>`);
}
const sh=$("#sheet");
sh.onclick=e=>{
  const t=e.target,a=t.closest("[data-a]"),s=t.closest("[data-s]"),k=t.closest("[data-k]"),q=t.closest("[data-q]"),z=t.closest("[data-z]"),ql=t.closest("[data-ql]"),rm=t.closest("[data-rm]");
  if(t.closest("#close"))return shut();
  if(s){sel.s=s.dataset.s;sel.m=sel.ok="";view()}
  if(k){sel.c=k.dataset.k;sel.m=sel.ok="";view()}
  if(q){sel.q=Math.min(99,Math.max(1,sel.q+ +q.dataset.q));view()}
  if(ql){const[i,d]=ql.dataset.ql.split(",").map(Number);cart[i].q=Math.min(99,Math.max(1,cart[i].q+d));saveCart();mode==="view"?view():showCart()}
  if(rm){cart.splice(+rm.dataset.rm,1);saveCart();mode==="view"?view():showCart()}
  if(z){const i=cur.s.indexOf(z.dataset.z);i<0?cur.s.push(z.dataset.z):cur.s.splice(i,1);cur.s.sort((x,y)=>ALL.indexOf(x)-ALL.indexOf(y));mark();edit()}
  if(a){const x=a.dataset.a;
    if(x==="addcart")add();
    if(x==="guidep"){gfrom=true;guide()}
    if(x==="gback"){if(gfrom&&cur)view();else shut()}
    if(x==="cart")showCart();
    if(x==="clear"){cart=[];saveCart();showCart()}
    if(x==="edit")edit();
    if(x==="done")shut();
    if(x==="noimg"){cur.img="";mark();edit()}
    if(x==="del"){if(a.dataset.sure){P.splice(P.indexOf(cur),1);mark();shut()}else{a.dataset.sure=1;a.textContent="¿Seguro? Toca otra vez"}}}
};
sh.oninput=e=>{const t=e.target,f=t.dataset.f,st=t.dataset.st;
  if(f){cur[f]=f==="p"?(t.value===""?"":+t.value):f==="col"?t.value.split(",").map(x=>x.trim()).filter(Boolean):t.value;mark()}
  if(t.dataset.g){const q=t.dataset.g.split(",");D.g[+q[0]][q[1]]=t.value;mark()}
  if(st){S[st]=t.type==="checkbox"?t.checked:t.value.trim();mark()}};
sh.onchange=async e=>{if(e.target.id==="file"&&e.target.files[0]){cur.img=await shrink(e.target.files[0]);mark();edit()}};
function shrink(f){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.8))};i.src=u})}
$("#ov").onclick=e=>{if(e.target.id==="ov")shut()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov").classList.contains("on"))shut()});

function doc(){
  return "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>"+esc(S.name)+"</title><link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap\" rel=\"stylesheet\"><style id=\"css\">"+$("#css").textContent+"</style></head><body><div id=\"root\"></div><div class=\"ov\" id=\"ov\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Detalle\"><div class=\"sheet\" id=\"sheet\"></div></div><script type=\"application/json\" id=\"data\">"+JSON.stringify(D).replace(/</g,"\\u003c")+"<\/script><script id=\"app\">"+$("#app").textContent+"<\/script></body></html>";
}
async function save(){
  const st=$("#st");st.textContent="Publicando…";
  try{if(!window.claude){dlFile(doc(),"index.html","text/html");dirty=false;st.textContent="Listo: se descargó index.html. Súbelo a tu hosting para actualizar.";return}const a=await claude.use("artifact");if(!a)throw{};await a.publish(doc())}
  catch(e){st.textContent=e&&e.code==="too_large"?"Las fotos pesan demasiado: quita alguna.":"No se pudo publicar. Intenta de nuevo."}
}
render();

(function(){const b=document.createElement("div");b.id="bg";b.setAttribute("aria-hidden","true");const E=["🐶","🦴","🎾","🧸","🐕","🐩","🦴"],C=["#E5156F","#1E88E5","#FFB400","#7A3E1D"],paw=c=>`<svg viewBox="0 0 24 24" width="1em" height="1em" fill="${c}"><ellipse cx="12" cy="16" rx="5.5" ry="4.5"/><ellipse cx="5" cy="10" rx="2.2" ry="3"/><ellipse cx="9.5" cy="5.5" rx="2.2" ry="3"/><ellipse cx="14.5" cy="5.5" rx="2.2" ry="3"/><ellipse cx="19" cy="10" rx="2.2" ry="3"/></svg>`;for(let i=0;i<28;i++){const s=document.createElement("span");if(i%3===0)s.innerHTML=paw(C[(i/3|0)%4]);else s.textContent=E[i%E.length];s.style.cssText=`left:${(i*37+11)%96}%;font-size:${22+(i*7)%22}px;animation-duration:${15+(i*5)%14}s;animation-delay:-${(i*3)%18}s;--r:${(i%2?1:-1)*(40+i*9)}deg;--t:${(i*53)%92}%`;b.appendChild(s)}document.body.prepend(b)})();
(async()=>{try{if(!window.claude){if(location.hash==="#admin"){owner=true;render()}return}const u=await claude.use("user");owner=!!u&&await u.isOwner();if(owner)render()}catch(e){}})();
</script></body></html>
